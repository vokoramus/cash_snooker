<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Зелёное сукно с золотой рамкой -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#1b6b38" stroke="#ffd54f" stroke-width="3.5"/>
  <!-- Внутренняя разметка -->
  <rect x="7" y="7" width="50" height="50" rx="10" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <!-- Декоративные мини-шары (красный, розовый, чёрный) -->
  <circle cx="17" cy="17" r="5" fill="#d32f2f" stroke="#000" stroke-width="1"/>
  <circle cx="32" cy="14" r="5" fill="#ec407a" stroke="#000" stroke-width="1"/>
  <circle cx="47" cy="17" r="5" fill="#111111" stroke="#ffd54f" stroke-width="1"/>

  <!-- Тёмный плашечный круг в центре под цифру -->
  <circle cx="32" cy="39" r="16" fill="#111518" stroke="#ffd54f" stroke-width="2"/>

  <!-- Число 42 -->
  <text x="32" y="45" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#ffd54f">CS</text>
</svg>
